name: CI

on:
  push:
    branches:
      - main
      - develop
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up environment
      run: make setup

    - name: Run tests
      run: make test

    - name: Run linter
      run: make lint